name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild at 09:00 IST (03:30 UTC) so posts scheduled for a future date go live on that day.
  schedule:
    - cron: "30 3 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build-interactive.mjs
      - name: Build blog (publishes posts whose date has passed)
        run: python scripts/build_blog.py
      - name: Build public artifact and sitemap
        run: python scripts/build.py
      - name: Check crawlability and SEO
        run: python scripts/check_seo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow after successful deployment
        continue-on-error: true
        run: python scripts/indexnow.py --submit
